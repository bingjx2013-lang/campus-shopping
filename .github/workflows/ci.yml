name: CI
on:
  push:
    branches: [main, campus-app-development-v1, "work/**"]
  pull_request:
    branches: [main, campus-app-development-v1]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Domain regression tests
        run: node scripts/test-domain-rules.mjs
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
