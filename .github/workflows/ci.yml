name: CI

on:
  push:
    branches: [campus-app-development-v1, work/database-review-v1]
  pull_request:
    branches: [main, campus-app-development-v1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d campus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit all dependencies
        run: |
          npm audit --json > npm-audit-full.json || true
          node -e "const a=require('./npm-audit-full.json'); console.log(JSON.stringify({metadata:a.metadata?.vulnerabilities, advisories:Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,isDirect:v.isDirect,range:v.range,fixAvailable:v.fixAvailable,via:v.via.map(x=>typeof x==='string'?x:{name:x.name,title:x.title,range:x.range,url:x.url})}))},null,2))"
      - name: Audit production dependencies
        run: |
          npm audit --omit=dev --json > npm-audit-production.json || true
          node -e "const a=require('./npm-audit-production.json'); console.log('Production dependency audit:', JSON.stringify(a.metadata?.vulnerabilities||{}, null, 2)); console.log(JSON.stringify(Object.entries(a.vulnerabilities||{}).map(([name,v])=>({name,severity:v.severity,range:v.range,fixAvailable:v.fixAvailable})),null,2))"
      - name: Preserve generated audit and lock files
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_id }}
          path: |
            package-lock.json
            npm-audit-full.json
            npm-audit-production.json
          if-no-files-found: error
      - name: Apply draft schema on isolated PostgreSQL 15
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d campus_test -v ON_ERROR_STOP=1 -f database/migrations/0002_campus_shopping_full_schema_v1_draft.sql
      - name: Apply inventory and finance reliability draft on isolated PostgreSQL 15
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d campus_test -v ON_ERROR_STOP=1 -f database/migrations/0003_inventory_finance_reliability_v1_draft.sql
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
