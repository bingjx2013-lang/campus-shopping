name: CI

on:
  push:
    branches: [campus-app-development-v1, "work/**"]
  pull_request:
    branches: [main, campus-app-development-v1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Audit all dependencies
        run: npm audit --json > npm-audit-full.json || true
      - name: Audit production dependencies
        run: npm audit --omit=dev --json > npm-audit-production.json || true
      - name: Preserve audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-audit-${{ github.run_id }}
          path: |
            package-lock.json
            npm-audit-full.json
            npm-audit-production.json
          if-no-files-found: error
      - name: Enforce dependency audit policy
        run: node scripts/check-npm-audit.mjs
      - name: Domain regression tests
        run: node scripts/test-domain-rules.mjs
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
