name: CI

on:
  push:
    branches: [campus-app-development-v1]
  pull_request:
    branches: [main, campus-app-development-v1]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: TypeScript check
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build
